---

defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - storage
    - optical
    - network
    - power
    - rfkill
    - lp
    - scanner

# No autologin on the installed system — the live session autologins as
# liveuser for convenience only; a real install should always require a
# login, matching standard practice.
autologinGroup:  autologin
doAutologin:     false

sudoersGroup:    wheel
sudoersConfigureWithGroup: true

setRootPassword: true
doReusePassword: true

# Debian's current Calamares policy requires at least six characters and does
# not expose the weak-password override. Keep the same minimum here; the
# maxLength value remains unlimited, matching Debian.
passwordRequirements:
    minLength: 6
    maxLength: -1

# Hide and disable the override that previously allowed users to proceed with
# a password which failed the configured checks.
allowWeakPasswords: false
allowWeakPasswordsDefault: false

# The real key is nested `user.shell`, not a flat `userShell` — verified
# against Calamares' own Config.cpp. The flat key was silently ignored
# (no error, no warning), so every install so far got useradd's own
# default (/bin/bash) instead. Caught only by checking the actual
# `useradd` invocation in session.log against what was configured here.
user:
  shell: /usr/bin/zsh

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${product}"
  forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
