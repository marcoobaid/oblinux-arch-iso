# Runs before initcpio (mkinitcpio -P) regenerates the initramfs on the
# target. Three things need fixing first, all because unpackfs clones the
# *live* filesystem as-is:
#
# 1. airootfs/etc/mkinitcpio.conf.d/archiso.conf (a drop-in, not the base
#    /etc/mkinitcpio.conf file) is where OBLinux's live-only HOOKS live —
#    it references archiso/PXE/memdisk concepts that don't exist on a
#    real disk install and must be removed, or mkinitcpio would build an
#    initramfs that can't find/mount the real root filesystem.
#
# 2. The base /etc/mkinitcpio.conf (shipped by the `mkinitcpio` package
#    itself, never overridden by OBLinux) has no HOOKS line tuned for
#    this system at all — in particular, no `plymouth` hook, since that
#    only ever lived in the drop-in being removed. Set the target's
#    HOOKS= line directly with sed instead of using Calamares' initcpiocfg
#    module: initcpiocfg only supports prepend/append/remove on the
#    existing list, which can't express "insert plymouth right after
#    base/udev" precisely (prepend would put it before `base`, which is
#    wrong). The line below is the live HOOKS line
#    (mkinitcpio.conf.d/archiso.conf) with only the archiso/PXE/memdisk
#    hooks removed and `fsck` added — same relative order as the live
#    config, which is already proven working (verified boot testing,
#    docs/TESTING.md), plus `fsck` since this is now a real disk, not a
#    read-only squashfs.
#
# 3. airootfs/etc/mkinitcpio.d/linux.preset (the standard archiso-profile
#    override, not an OBLinux-specific one) hardcodes PRESETS=('archiso')
#    pointing -c at the archiso.conf drop-in removed in step 1 — so
#    mkinitcpio would fail with "must be readable" on a deleted file even
#    after steps 1-2. Missed in the initial config write; caught in round
#    10 of install testing (docs/TESTING.md) via session.log, since the
#    installer only reports the final mkinitcpio failure, not this cause.
#    Replaced with the standard default+fallback preset the `linux`
#    package itself ships (verified against mkinitcpio's own upstream
#    example preset and Arch packaging) — same PRESETS/image layout a
#    normal Arch install gets, nothing OBLinux-specific to maintain here.
#
# 4. Two stock Arch/GRUB behaviors, root-caused against the *actual*
#    /etc/grub.d/10_linux pulled from a real OBLinux boot (not a
#    third-party mirror -- an earlier pass here trusted an Ubuntu-
#    patched copy that turned out to differ from Arch's in exactly the
#    two places that mattered, and shipped a fix that only half-worked
#    as a result; every substitution below is now verified against the
#    real file):
#
#    a) Menu titles read "OBLinux Linux, with Linux linux" / "...
#       (fallback initramfs)" instead of plain "OBLinux" / "OBLinux
#       (fallback initramfs)". Two separate causes, both in
#       /etc/grub.d/10_linux: (i) its preamble builds
#       OS="${GRUB_DISTRIBUTOR} Linux" for any non-empty distributor --
#       inherited from upstream GRUB's "${GRUB_DISTRIBUTOR} GNU/Linux"
#       fallback, with the "GNU/" dropped by Arch's own PKGBUILD sed
#       and no special-casing for "OBLinux" -- so "${os}" is never
#       just the plain "OBLinux" Calamares set as GRUB_DISTRIBUTOR to
#       begin with; (ii) linux_entry()'s title="$(gettext_printf "%s,
#       with Linux %s" ...)" (and the "(fallback initramfs)"/"(booster
#       initramfs)" variants) then appends ", with Linux ${version}"
#       on top of that. Fixed at both places: the OS= line drops the
#       " Linux" suffix, and each title= line collapses to plain
#       "${os}" (or "${os} (fallback/booster initramfs)").
#       GRUB_DISABLE_RECOVERY: true (grubcfg.conf) means the
#       recovery-mode title is never generated, so it's left alone.
#
#    b) GRUB prints "Loading Linux ..." / "Loading initial ramdisk
#       ..." on a plain black console before handing off to Plymouth.
#       Not gated behind any quiet/quiet_boot check in this GRUB
#       version at all (confirmed against the real file -- no such
#       guard exists here, unlike some older/other distros' patched
#       10_linux) -- linux_entry() unconditionally emits an
#       `echo 'Loading ...'` line into every generated menuentry, right
#       before the `linux`/`initrd` command it precedes. Fixed by
#       deleting just that echo line (matched on its unique
#       "$message" | grub_quote text) in both places it occurs, leaving
#       the `linux`/`initrd` commands themselves -- and GRUB's own real
#       error output if either of them actually fails -- untouched.
#
#    Patched narrowly with sed (matching exact text, not line position)
#    rather than shipping a full replacement 10_linux, so a future
#    `grub` package update keeps working -- if its exact text ever
#    changes again, these substitutions are silent no-ops, never a
#    failed install (same reasoning that caused the half-fix above, now
#    at least verified against real ground truth rather than a guess).
#    This applies to the *installed* system only -- the live ISO's own
#    boot menu is a separate mechanism, see grub/grub.cfg and
#    grub/loopback.cfg.
#
#    Calamares' shellprocess module pre-scans the whole script string
#    for ${var}/$var placeholders it must resolve (only ${ROOT} is one
#    of its own) and aborts the *entire* step -- never runs any
#    command -- if it finds one it doesn't recognize. The sed below
#    intentionally writes/matches literal $os / ${os} / ${GRUB_DISTRIBUTOR}
#    text belonging to the *target's* grub script (evaluated later, at
#    grub-mkconfig time), not to Calamares itself -- but Calamares
#    can't tell the difference, so a first version written with
#    ordinary \$/${...} escaping got flagged as if those were its own
#    missing variables and refused to run anything, taking the whole
#    install down with it (confirmed via a real failed install's
#    session.log: "Missing variables: os, os, quiet_boot, type",
#    Calamares::CommandList::run(), before a single command executed).
#    Every literal "$" the sed needs is therefore written so Calamares
#    never sees a bare $-prefixed token: [$] in the pattern (a bracket
#    expression -- also needed so ERE doesn't reinterpret a raw $ as an
#    end-of-line anchor) and \x24 in the replacement (GNU sed's hex
#    escape, valid in replacement text without going through regex
#    compilation, unlike in the pattern).
---

dontChroot: false

timeout: 60

script:
    - "-rm ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - "sed -i 's/^HOOKS=.*/HOOKS=(base udev microcode modconf kms plymouth block filesystems keyboard fsck)/' ${ROOT}/etc/mkinitcpio.conf"
    - |
        cat > ${ROOT}/etc/mkinitcpio.d/linux.preset <<'PRESET_EOF'
        # mkinitcpio preset file for the 'linux' package
        ALL_config="/etc/mkinitcpio.conf"
        ALL_kver="/boot/vmlinuz-linux"
        PRESETS=('default' 'fallback')
        default_image="/boot/initramfs-linux.img"
        fallback_image="/boot/initramfs-linux-fallback.img"
        fallback_options="-S autodetect"
        PRESET_EOF
    - |
        sed -E -i \
          -e 's/^  OS="[$]\{GRUB_DISTRIBUTOR\} Linux"$/  OS="\x24{GRUB_DISTRIBUTOR}"/' \
          -e 's/title="[$]\(gettext_printf "%s, with Linux %s" "[$]\{os\}" "[$]\{version\}"\)"/title="\x24{os}"/' \
          -e 's/title="[$]\(gettext_printf "%s, with Linux %s \(fallback initramfs\)" "[$]\{os\}" "[$]\{version\}"\)"/title="\x24{os} (fallback initramfs)"/' \
          -e 's/title="[$]\(gettext_printf "%s, with Linux %s \(booster initramfs\)" "[$]\{os\}" "[$]\{version\}"\)"/title="\x24{os} (booster initramfs)"/' \
          -e '/"[$]message" \| grub_quote/d' \
          ${ROOT}/etc/grub.d/10_linux
