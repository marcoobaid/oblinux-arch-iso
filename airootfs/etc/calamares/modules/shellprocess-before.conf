# Runs before initcpio (mkinitcpio -P) regenerates the initramfs on the
# target. Three things need fixing first, all because unpackfs clones the
# *live* filesystem as-is:
#
# 1. airootfs/etc/mkinitcpio.conf.d/archiso.conf (a drop-in, not the base
#    /etc/mkinitcpio.conf file) is where OBLinux's live-only HOOKS live —
#    it references archiso/PXE/memdisk concepts that don't exist on a
#    real disk install and must be removed, or mkinitcpio would build an
#    initramfs that can't find/mount the real root filesystem.
#
# 2. The base /etc/mkinitcpio.conf (shipped by the `mkinitcpio` package
#    itself, never overridden by OBLinux) has no HOOKS line tuned for
#    this system at all — in particular, no `plymouth` hook, since that
#    only ever lived in the drop-in being removed. Set the target's
#    HOOKS= line directly with sed instead of using Calamares' initcpiocfg
#    module: initcpiocfg only supports prepend/append/remove on the
#    existing list, which can't express "insert plymouth right after
#    base/udev" precisely (prepend would put it before `base`, which is
#    wrong). The line below is the live HOOKS line
#    (mkinitcpio.conf.d/archiso.conf) with only the archiso/PXE/memdisk
#    hooks removed and `fsck` added — same relative order as the live
#    config, which is already proven working (verified boot testing,
#    docs/TESTING.md), plus `fsck` since this is now a real disk, not a
#    read-only squashfs.
#
# 3. airootfs/etc/mkinitcpio.d/linux.preset (the standard archiso-profile
#    override, not an OBLinux-specific one) hardcodes PRESETS=('archiso')
#    pointing -c at the archiso.conf drop-in removed in step 1 — so
#    mkinitcpio would fail with "must be readable" on a deleted file even
#    after steps 1-2. Missed in the initial config write; caught in round
#    10 of install testing (docs/TESTING.md) via session.log, since the
#    installer only reports the final mkinitcpio failure, not this cause.
#    Replaced with the standard default+fallback preset the `linux`
#    package itself ships (verified against mkinitcpio's own upstream
#    example preset and Arch packaging) — same PRESETS/image layout a
#    normal Arch install gets, nothing OBLinux-specific to maintain here.
#
# 4. Two stock Arch/GRUB behaviors, confirmed against a real installed
#    system: the auto-generated GRUB menu titles read "OBLinux Linux,
#    with Linux linux" / "... (fallback initramfs)", and GRUB prints
#    "Loading Linux ..." / "Loading initial ramdisk ..." on a plain
#    black console before handing off to Plymouth. Neither is an
#    OBLinux bug or something a Calamares/GRUB_* config key controls —
#    both are hardcoded in Arch's own patched /etc/grub.d/10_linux:
#    it unconditionally appends ", with Linux ${version}" to the title
#    (and "${version}" is literally the string "linux" for Arch's
#    default kernel package — every stock Arch install shows the same
#    "Arch Linux, with Linux linux"), and its loading-message guard
#    only skips printing for a "simple"-type entry, but Arch's own
#    fallback-initramfs patch always uses "advanced"/"fallback" types
#    here, so the messages are unconditional — "quiet" on
#    GRUB_CMDLINE_LINUX_DEFAULT does not reach this at all. Patched
#    narrowly with sed (matching only the exact title/guard text, not
#    line position) rather than shipping a full replacement 10_linux,
#    so a future `grub` package update keeps working — if its exact
#    text ever changes, these substitutions are silent no-ops, never a
#    failed install. Simplifies the title to plain "OBLinux" / "OBLinux
#    (fallback initramfs)" and drops the two loading echoes entirely;
#    GRUB's own real error output for an actual boot failure comes from
#    the `linux`/`initrd` commands themselves, not these cosmetic
#    echoes, so this doesn't hide anything diagnostic. This applies to
#    the *installed* system only — the live ISO's own boot menu is a
#    separate mechanism, see grub/grub.cfg and grub/loopback.cfg.
---

dontChroot: false

timeout: 60

script:
    - "-rm ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - "sed -i 's/^HOOKS=.*/HOOKS=(base udev microcode modconf kms plymouth block filesystems keyboard fsck)/' ${ROOT}/etc/mkinitcpio.conf"
    - |
        cat > ${ROOT}/etc/mkinitcpio.d/linux.preset <<'PRESET_EOF'
        # mkinitcpio preset file for the 'linux' package
        ALL_config="/etc/mkinitcpio.conf"
        ALL_kver="/boot/vmlinuz-linux"
        PRESETS=('default' 'fallback')
        default_image="/boot/initramfs-linux.img"
        fallback_image="/boot/initramfs-linux-fallback.img"
        fallback_options="-S autodetect"
        PRESET_EOF
    - |
        sed -E -i \
          -e 's/title="\$\(gettext_printf "%s, with Linux %s" "\$\{os\}" "\$\{version\}"\)"/title="${os}"/' \
          -e 's/title="\$\(gettext_printf "%s, with Linux %s \(fallback initramfs\)" "\$\{os\}" "\$\{version\}"\)"/title="${os} (fallback initramfs)"/' \
          -e 's/\[ x"\$quiet_boot" = x0 \] \|\| \[ x"\$type" != xsimple \]/false/g' \
          ${ROOT}/etc/grub.d/10_linux
