# OBLinux partitioning: automated erase and manual partitioning are available.
# LVM remains disabled and ext4 remains the automated-install default; manual
# mode can reuse supported existing layouts and create the required mount
# points, including the EFI System Partition on UEFI systems.
---

efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB

drawNestedPartitions:   false

alwaysShowPartitionLabels: true

# Keep Calamares' manual editor alongside the existing automated choices.
# This changes only the visibility of Manual partitioning; Erase disk and the
# existing EFI/default-filesystem settings below remain unchanged.
allowManualPartitioning: true

# Forces an explicit choice on the partitioning page rather than a
# pre-selected option someone could click past — "erase" in particular
# is destructive, so it should never be the default selection.
initialPartitioningChoice: none

initialSwapChoice: none

defaultFileSystemType:  "ext4"

essentialMounts: [ "live-*", "control" ]

lvm:
    enable: false
