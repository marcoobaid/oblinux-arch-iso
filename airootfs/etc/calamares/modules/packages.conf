---

backend: pacman

skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 5
    disable_download_timeout: false
    needed_only: true

# The installer and the extension used only to display its live desktop
# shortcut have no business remaining on a fresh install.
operations:
  - remove:
    - calamares
    - gnome-shell-extension-desktop-icons-ng
